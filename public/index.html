<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <meta name="description" content="Search the web with Ohio Search.">
    <title>Ohio Search</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><a class="wordmark" href="/" aria-label="Ohio Search home">ohio<span>search</span></a></header>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">A simple way to explore</p>
        <h1 id="page-title">Search the web.</h1>
        <p class="intro">Find websites, answers, and ideas from one place.</p>
        <form id="search-form" class="search-form" role="search">
          <label class="visually-hidden" for="search-input">Search the web</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search-input" name="q" type="search" placeholder="What are you looking for?" maxlength="200" autocomplete="off" required>
          <button type="submit">Search</button>
        </form>
        <p class="provider-note">Web results provided by Brave Search. Your search stays on this page.</p>
      </section>
      <section id="results-section" class="results-section" aria-live="polite" aria-busy="false">
        <p id="status" class="status"></p>
        <div id="results" class="results"></div>
      </section>
      <footer>Ohio Search · Works in Firefox, Microsoft Edge, and Chrome</footer>
    </main>
  </body>
</html>
